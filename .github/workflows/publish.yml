name: Publish

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    name: Check publish source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Check branch or tag and version
        run: |
          python - <<'PY'
          import os
          import tomllib

          version = tomllib.load(open("pyproject.toml", "rb"))["tool"]["poetry"]["version"]
          ref = os.environ["GITHUB_REF"]
          if ref.startswith("refs/tags/v"):
              tag = ref.removeprefix("refs/tags/v")
              if tag != version:
                  raise SystemExit(f"tag {tag} does not match version {version}")
          elif ref == "refs/heads/stable":
              print(f"workflow_dispatch from stable for {version}")
          else:
              raise SystemExit(
                  f"publishing is only allowed from stable or a v* tag, got {ref}"
              )
          PY
      - name: Check tag provenance
        run: |
          git fetch origin stable
          git merge-base --is-ancestor "$GITHUB_SHA" origin/stable


  security-delta:
    name: Block unreviewed Dependabot risk before PyPI
    needs: preflight
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      vulnerability-alerts: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Enforce fresh authenticated Dependabot delta (fail closed)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/reconcile_dependabot_alerts.py \
            --delta --repository "$GITHUB_REPOSITORY" \
            > "$RUNNER_TEMP/dependabot-delta.json"
      - name: Summarize release security delta
        if: always()
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path(os.environ["RUNNER_TEMP"]) / "dependabot-delta.json"
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("### Authenticated Dependabot release gate\n")
              if not path.is_file() or not path.stat().st_size:
                  summary.write(
                      "No valid delta report was produced. Publication is blocked.\n"
                  )
              else:
                  try:
                      report = json.loads(path.read_text())
                  except (OSError, ValueError):
                      summary.write(
                          "Cannot parse authenticated delta. Publication is blocked.\n"
                      )
                  else:
                      for label, value in (
                          ("Baseline records", report.get("baseline_records")),
                          ("Current records", report.get("current_records")),
                          ("Unchanged open", len(report.get("unchanged_open", []))),
                          ("New open", len(report.get("new_open", []))),
                          ("Reopened", len(report.get("reopened", []))),
                          ("Requires review", len(report.get("review_required", []))),
                          ("Incomplete", report.get("comparison_incomplete")),
                          ("Exit code", report.get("exit_code")),
                      ):
                          summary.write(f"- {label}: `{value}`\n")
          PY

  test:
    name: Test the release commit on Python ${{ matrix.python }}
    needs: preflight
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest httpx httpx2
      - name: Run tests
        run: python -m pytest -q

  build:
    name: Build distributions
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - name: Build distributions
        run: |
          python -m pip install --upgrade pip
          pip install build twine
          python -m build
          twine check dist/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: [build, security-delta]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/fastapi-cache-stable
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086
