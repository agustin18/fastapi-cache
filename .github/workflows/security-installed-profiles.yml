name: Installed runtime security profiles

on:
  workflow_dispatch:
  pull_request:
    branches: [stable]
    paths:
      - ".github/workflows/security-installed-profiles.yml"
      - "pyproject.toml"
      - "poetry.lock"
      - "fastapi_cache/**"
      - "scripts/validate_security_audit.py"
      - "tests/test_installed_security_profiles_workflow.py"

permissions:
  contents: read

jobs:
  audit:
    name: Python ${{ matrix.python }} / ${{ matrix.extra }} / ${{ matrix.distribution }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - {python: "3.11", extra: "none", distribution: "wheel"}
          - {python: "3.11", extra: "redis", distribution: "wheel"}
          - {python: "3.12", extra: "none", distribution: "wheel"}
          - {python: "3.12", extra: "redis", distribution: "wheel"}
          - {python: "3.12", extra: "all", distribution: "sdist"}
          - {python: "3.13", extra: "none", distribution: "wheel"}
          - {python: "3.13", extra: "redis", distribution: "wheel"}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Build both distribution formats from this exact commit
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Install selected distribution in an isolated consumer
        env:
          PROFILE_EXTRA: ${{ matrix.extra }}
          PROFILE_DISTRIBUTION: ${{ matrix.distribution }}
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/consumer"
          "$RUNNER_TEMP/consumer/bin/python" -m pip install --upgrade pip
          if [ "$PROFILE_DISTRIBUTION" = "sdist" ]; then
            distribution="$(realpath dist/*.tar.gz)"
          else
            distribution="$(realpath dist/*.whl)"
          fi
          if [ "$PROFILE_EXTRA" = "none" ]; then
            "$RUNNER_TEMP/consumer/bin/python" -m pip install "$distribution"
          else
            "$RUNNER_TEMP/consumer/bin/python" -m pip install "$distribution[$PROFILE_EXTRA]"
          fi
          "$RUNNER_TEMP/consumer/bin/python" -m pip check
      - name: Create independent auditor
        run: |
          python -m venv "$RUNNER_TEMP/auditor"
          "$RUNNER_TEMP/auditor/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/auditor/bin/python" -m pip install pip-audit==2.10.1
      - name: Record exact installed packages and metadata
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/security-evidence
          PROFILE_EXTRA: ${{ matrix.extra }}
          PROFILE_DISTRIBUTION: ${{ matrix.distribution }}
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          sha256sum dist/* > "$EVIDENCE_DIR/distributions.sha256"
          "$RUNNER_TEMP/consumer/bin/python" -m pip freeze > "$EVIDENCE_DIR/installed-freeze.txt"
          "$RUNNER_TEMP/consumer/bin/python" - <<'PY'
          import importlib.metadata as metadata
          import json
          import os
          import pathlib
          import sys
          import sysconfig

          target = pathlib.Path(sysconfig.get_paths()["purelib"])
          evidence = pathlib.Path(os.environ["EVIDENCE_DIR"])
          packages = [
              {"name": dist.metadata["Name"], "version": dist.version}
              for dist in metadata.distributions(path=[str(target)])
          ]
          packages.sort(key=lambda item: item["name"].lower())
          (evidence / "installed-packages.json").write_text(
              json.dumps(packages, indent=2)
          )
          (evidence / "installed-METADATA.txt").write_text(
              metadata.distribution("fastapi-cache-stable").read_text("METADATA")
          )
          (evidence / "site-packages-path.txt").write_text(str(target))
          (evidence / "profile.json").write_text(
              json.dumps(
                  {
                      "python": sys.version,
                      "extra": os.environ["PROFILE_EXTRA"],
                      "distribution": os.environ["PROFILE_DISTRIBUTION"],
                      "installed_count": len(packages),
                  },
                  indent=2,
              )
          )
          print(f"Recorded {len(packages)} installed packages from {target}")
          PY
      - name: Audit the isolated installed runtime (not poetry.lock)
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/security-evidence
        run: |
          set -euo pipefail
          target="$(cat "$EVIDENCE_DIR/site-packages-path.txt")"
          "$RUNNER_TEMP/auditor/bin/pip-audit" \
            --path "$target" --aliases off --format json \
            --output "$EVIDENCE_DIR/pip-audit.json"
          python scripts/validate_security_audit.py \
            "$EVIDENCE_DIR/pip-audit.json" \
            --installed-packages "$EVIDENCE_DIR/installed-packages.json" \
            --wheel-metadata "$EVIDENCE_DIR/installed-METADATA.txt"
      - name: Upload evidence even on audit failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: security-installed-${{ matrix.python }}-${{ matrix.extra }}-${{ matrix.distribution }}
          path: ${{ runner.temp }}/security-evidence/
          if-no-files-found: warn
          retention-days: 90
