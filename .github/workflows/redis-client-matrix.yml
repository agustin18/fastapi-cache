name: Redis client compatibility research

on:
  pull_request:
    paths:
      - ".github/workflows/redis-client-matrix.yml"
      - "tests/test_redis_client_matrix.py"
      - "tests/test_redis_clear.py"
      - "fastapi_cache/backends/redis.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  redis-client-matrix:
    name: redis-py ${{ matrix.client }} / Python ${{ matrix.python }} / Redis ${{ matrix.server }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The published 0.3.x compatibility baseline remains mandatory.
          - { python: "3.8", client: "4.6.0", server: "7.0", experimental: false }
          - { python: "3.12", client: "4.6.0", server: "7.0", experimental: false }
          # Exploratory combinations: failures are data, not release gates.
          - { python: "3.8", client: "5.2.1", server: "7.0", experimental: true }
          - { python: "3.8", client: "6.1.0", server: "7.4", experimental: true }
          - { python: "3.12", client: "5.2.1", server: "7.4", experimental: true }
          - { python: "3.12", client: "6.1.0", server: "7.4", experimental: true }
          - { python: "3.12", client: "7.2.1", server: "7.4", experimental: true }
          - { python: "3.12", client: "8.1.0", server: "7.4", experimental: true }
    services:
      redis:
        image: redis:${{ matrix.server }}
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install project and selected Redis client
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . "pytest==8.3.5" "httpx==0.27.0"
          # Install each selected client's real dependencies, including
          # async-timeout on legacy Python. Published redis<5 metadata remains
          # unchanged, so newer client lanes are intentionally out-of-range.
          python -m pip install --force-reinstall "redis==${{ matrix.client }}"
          python -c "import redis; print('redis-py:', redis.__version__)"
          if [ "${{ matrix.experimental }}" = "false" ]; then
            python -m pip check
          fi
      - name: Run real Redis backend compatibility checks
        env:
          REDIS_URL: redis://localhost:6379/0
          REQUIRE_REDIS: "1"
        run: |
          python -m pytest -q -rs tests/test_redis_client_matrix.py tests/test_redis_clear.py
