name: Redis client compatibility research

on:
  pull_request:
    paths:
      - ".github/workflows/redis-client-matrix.yml"
      - "tests/test_redis_client_matrix.py"
      - "tests/test_redis_clear.py"
      - "tests/redis_consumer_probe.py"
      - "tests/conftest.py"
      - "fastapi_cache/**"
      - "pyproject.toml"
      - "poetry.lock"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: redis-research-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  redis-client-matrix:
    name: redis-py ${{ matrix.client }} / Py ${{ matrix.python }} / Redis ${{ matrix.server }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Even exploratory jobs fail visibly; a green run must mean tests passed.
    # Their success is research evidence, not an expanded published contract.
    strategy:
      fail-fast: false
      matrix:
        include:
          # The published redis-py 4.x contract: real wheel, mandatory.
          - { python: "3.8",  client: "4.6.0", server: "6.2", experimental: false }
          - { python: "3.9",  client: "4.6.0", server: "7.0", experimental: false }
          - { python: "3.10", client: "4.6.0", server: "7.0", experimental: false }
          - { python: "3.11", client: "4.6.0", server: "7.4", experimental: false }
          - { python: "3.12", client: "4.6.0", server: "7.0", experimental: false }
          - { python: "3.13", client: "4.6.0", server: "7.4", experimental: false }

          # Client versions outside published metadata: synthetic wheel in
          # isolated scratch directory; evidence only, never publish.
          - { python: "3.8",  client: "5.2.1", server: "6.2", experimental: true }
          - { python: "3.8",  client: "6.1.0", server: "7.4", experimental: true }
          - { python: "3.8",  client: "6.1.0", server: "6.2", experimental: true }
          - { python: "3.10", client: "8.1.0", server: "6.2", experimental: true }
          - { python: "3.12", client: "7.2.1", server: "6.2", experimental: true }
          - { python: "3.9",  client: "5.2.1", server: "7.4", experimental: true }
          - { python: "3.9",  client: "6.1.0", server: "7.4", experimental: true }
          - { python: "3.9",  client: "7.0.1", server: "7.4", experimental: true }
          - { python: "3.10", client: "5.2.1", server: "7.4", experimental: true }
          - { python: "3.10", client: "7.2.1", server: "7.4", experimental: true }
          - { python: "3.10", client: "8.1.0", server: "8.0", experimental: true }
          - { python: "3.11", client: "6.1.0", server: "8.0", experimental: true }
          - { python: "3.11", client: "7.2.1", server: "8.0", experimental: true }
          - { python: "3.11", client: "8.1.0", server: "8.0", experimental: true }
          - { python: "3.12", client: "5.2.1", server: "6.2", experimental: true }
          - { python: "3.12", client: "6.1.0", server: "7.4", experimental: true }
          - { python: "3.12", client: "7.2.1", server: "8.0", experimental: true }
          - { python: "3.12", client: "8.1.0", server: "7.4", experimental: true }
          - { python: "3.13", client: "5.2.1", server: "7.4", experimental: true }
          - { python: "3.13", client: "6.1.0", server: "8.0", experimental: true }
          - { python: "3.13", client: "7.2.1", server: "8.0", experimental: true }
          - { python: "3.13", client: "8.1.0", server: "8.0", experimental: true }

    services:
      redis:
        image: redis:${{ matrix.server }}
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Build isolated real wheel (scratch widened metadata if experimental)
        env:
          EXPERIMENTAL: ${{ matrix.experimental }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install "build==1.2.2"
          mkdir -p /tmp/redis-matrix-src
          cp -a fastapi_cache pyproject.toml README.md LICENSE NOTICE MIGRATION.md SUPPORT.md SECURITY.md CHANGELOG.md FORK_ORIGIN.md COMPATIBILITY.md /tmp/redis-matrix-src/
          python - <<'PY'
          import os
          from pathlib import Path

          path = Path("/tmp/redis-matrix-src/pyproject.toml")
          before = 'redis = { version = "^4.2.0rc1", optional = true }'
          after = 'redis = { version = ">=4.2.0rc1,<9.0.0", optional = true }'
          content = path.read_text()
          if content.count(before) != 1:
              raise SystemExit("Unexpected dependency declaration: refuse scratch rewrite")
          if os.environ["EXPERIMENTAL"] == "true":
              path.write_text(content.replace(before, after))
              print("SCRATCH-ONLY candidate metadata: redis >=4.2.0rc1,<9.0.0")
          else:
              print("Original published redis-py 4.x metadata")
          PY
          python -m build --wheel --outdir /tmp/redis-matrix-dist /tmp/redis-matrix-src

      - name: Resolve and install wheel in separate venv
        env:
          CLIENT: ${{ matrix.client }}
        run: |
          python -m venv /tmp/redis-matrix-venv
          /tmp/redis-matrix-venv/bin/python -m pip install --upgrade pip
          wheel=$(find /tmp/redis-matrix-dist -maxdepth 1 -name '*.whl' -print -quit)
          test -n "$wheel"
          /tmp/redis-matrix-venv/bin/python -m pip install "$wheel[redis]" "redis==$CLIENT" "pytest==8.3.5" "httpx==0.27.0"
          /tmp/redis-matrix-venv/bin/python -m pip check
          cd /tmp
          /tmp/redis-matrix-venv/bin/python - <<'PY'
          import hashlib
          import importlib.metadata as im
          import pathlib
          import sys
          from packaging.requirements import Requirement

          import fastapi_cache

          wheel = next(pathlib.Path("/tmp/redis-matrix-dist").glob("*.whl"))
          module = pathlib.Path(fastapi_cache.__file__).resolve()
          assert "site-packages" in module.parts, module
          assert "redis-matrix-src" not in str(module)
          redis_version = im.version("redis")
          requirements = [Requirement(line) for line in
                          im.metadata("fastapi-cache-stable").get_all("Requires-Dist") or []]
          active = [r for r in requirements if r.name == "redis"]
          assert len(active) == 1
          from packaging.version import Version
          assert Version(redis_version) in active[0].specifier
          print("Python:", sys.version)
          print("wheel_sha256:", hashlib.sha256(wheel.read_bytes()).hexdigest())
          print("Installed module:", module)
          print("redis-py:", redis_version)
          print("wheel Requires-Dist redis:", active[0])
          PY

      - name: Execute isolated real Redis backend and FastAPI tests
        env:
          REDIS_URL: redis://localhost:6379/0
          REQUIRE_REDIS: "1"
        run: |
          # Explicitly enforce pipeline failures: the implicit Actions bash
          # shell uses -e but does not guarantee -o pipefail.
          set -o pipefail
          set +e
          python -c 'import sys; sys.exit(7)' | tee /tmp/pipefail-probe.log
          proof=$?
          set -e
          test "$proof" -eq 7
          cd /tmp
          /tmp/redis-matrix-venv/bin/python -m pytest -q -rs "$GITHUB_WORKSPACE/tests/test_redis_client_matrix.py" "$GITHUB_WORKSPACE/tests/test_redis_clear.py" | tee /tmp/redis-matrix-tests.log
          /tmp/redis-matrix-venv/bin/python "$GITHUB_WORKSPACE/tests/redis_consumer_probe.py" | tee /tmp/redis-matrix-consumer.log

      - name: Capture audit evidence even on experimental failures
        if: always()
        env:
          CLIENT: ${{ matrix.client }}
          PY_VERSION: ${{ matrix.python }}
          SERVER: ${{ matrix.server }}
          EXPERIMENTAL: ${{ matrix.experimental }}
        run: |
          mkdir -p /tmp/redis-matrix-evidence
          cp /tmp/redis-matrix-*.log /tmp/redis-matrix-evidence/ 2>/dev/null || true
          if [ -x /tmp/redis-matrix-venv/bin/pip ]; then
            /tmp/redis-matrix-venv/bin/pip freeze > /tmp/redis-matrix-evidence/pip-freeze.txt
            /tmp/redis-matrix-venv/bin/pip check > /tmp/redis-matrix-evidence/pip-check.txt 2>&1 || true
          fi
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          directory = Path("/tmp/redis-matrix-evidence")
          wheels = sorted(Path("/tmp/redis-matrix-dist").glob("*.whl"))
          profile = {
              "git_commit": os.environ["GITHUB_SHA"],
              "python": os.environ["PY_VERSION"],
              "redis_py": os.environ["CLIENT"],
              "redis_server_image": "redis:" + os.environ["SERVER"],
              "metadata_scope": ("scratch widened, NOT published"
                                 if os.environ["EXPERIMENTAL"] == "true"
                                 else "unmodified published range"),
              "wheel_sha256": (hashlib.sha256(wheels[0].read_bytes()).hexdigest()
                               if len(wheels) == 1 else None),
              "logs_attached": [p.name for p in directory.glob("*.log")],
          }
          (directory / "profile.json").write_text(json.dumps(profile, indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: redis-matrix-py${{ matrix.python }}-client${{ matrix.client }}-server${{ matrix.server }}
          path: /tmp/redis-matrix-evidence/
          retention-days: 90

      - name: Summarize reproducible research profile
        if: always()
        env:
          CLIENT: ${{ matrix.client }}
          PY_VERSION: ${{ matrix.python }}
          SERVER: ${{ matrix.server }}
          EXPERIMENTAL: ${{ matrix.experimental }}
        run: |
          {
            echo "### Redis compatibility lane"
            echo "- Source commit: \`$GITHUB_SHA\`"
            echo "- Python: $PY_VERSION"
            echo "- redis-py client: $CLIENT"
            echo "- Redis server image: redis:$SERVER"
            echo "- Metadata: $(if [ "$EXPERIMENTAL" = true ]; then echo 'scratch-only widened, NOT published'; else echo 'current published constraint'; fi)"
            if [ -x /tmp/redis-matrix-venv/bin/pip ]; then
              echo "- Installed dependency check: see step logs"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
  redis-range-resolution:
    name: Proposed range resolver / Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - { python: "3.8", expected: "6.1" }
          - { python: "3.9", expected: "7.0" }
          - { python: "3.10", expected: "8.1" }
          - { python: "3.13", expected: "8.1" }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Build scratch wheel with proposed conditional metadata
        run: |
          python -m pip install --upgrade pip
          python -m pip install "build==1.2.2"
          mkdir -p /tmp/redis-range-src /tmp/redis-range-dist
          cp -a fastapi_cache pyproject.toml README.md LICENSE NOTICE MIGRATION.md SUPPORT.md SECURITY.md CHANGELOG.md FORK_ORIGIN.md COMPATIBILITY.md /tmp/redis-range-src/
          python - <<'PY'
          from pathlib import Path

          path = Path("/tmp/redis-range-src/pyproject.toml")
          before = 'redis = { version = "^4.2.0rc1", optional = true }'
          after = """redis = [
          { version = ">=4.2.0rc1,<6.2", python = ">=3.8,<3.9", optional = true },
          { version = ">=4.2.0rc1,<7.1", python = ">=3.9,<3.10", optional = true },
          { version = ">=4.2.0rc1,<8.2", python = ">=3.10,<3.14", optional = true },
          ]"""
          content = path.read_text()
          if content.count(before) != 1:
              raise SystemExit("Unexpected redis declaration in pyproject")
          path.write_text(content.replace(before, after))
          PY
          python -m build --wheel --outdir /tmp/redis-range-dist /tmp/redis-range-src
      - name: Resolve proposed range and verify installed client
        env:
          EXPECTED: ${{ matrix.expected }}
        run: |
          python -m venv /tmp/redis-range-venv
          /tmp/redis-range-venv/bin/python -m pip install --upgrade pip
          /tmp/redis-range-venv/bin/python -m pip install "packaging>=24"
          wheel=$(find /tmp/redis-range-dist -maxdepth 1 -name '*.whl' -print -quit)
          test -n "$wheel"
          /tmp/redis-range-venv/bin/python -m pip install "$wheel[redis]"
          /tmp/redis-range-venv/bin/python - <<'PY'
          import importlib.metadata as im
          import os
          from pathlib import Path
          from packaging.requirements import Requirement
          from packaging.version import Version

          installed = im.version("redis")
          expected = os.environ["EXPECTED"]
          assert installed.startswith(expected + "."), (installed, expected)
          requirements = [Requirement(line) for line in
                          im.metadata("fastapi-cache-stable").get_all("Requires-Dist") or []]
          redis_requirements = [r for r in requirements if r.name == "redis"]
          active = [
              r for r in redis_requirements
              if r.marker is None or r.marker.evaluate()
          ]
          assert len(active) == 1, redis_requirements
          assert Version(installed) in active[0].specifier
          print("Resolved redis-py:", installed)
          print("Active metadata:", active[0])
          print("Wheel:", Path(wheel).name if (wheel := next(Path("/tmp/redis-range-dist").glob("*.whl"))) else "missing")
          PY
          /tmp/redis-range-venv/bin/python -m pip check

