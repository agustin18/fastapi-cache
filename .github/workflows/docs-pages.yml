name: Publish documentation to GitHub Pages (manual)

# Explicit publication only. Merging this PR never deploys a website.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: fastapi-cache-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build and validate current published-docs site
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install pinned documentation tool
        run: python -m pip install "zensical==0.1.3"
      - name: Build site from committed sources
        run: zensical build --clean
      - name: Validate every local link and HTML anchor
        run: python scripts/check_docs_links.py --site-dir site --base-path /fastapi-cache
      - name: Validate release and migration entry points
        run: |
          python - <<'PY'
          from pathlib import Path
          for page in (
              "index.html",
              "getting-started/index.html",
              "migration/index.html",
              "reference/features/index.html",
              "guides/privacy/index.html",
              "reference/alternatives/index.html",
          ):
              file = Path("site") / page
              if not file.is_file():
                  raise SystemExit(f"Missing built docs page: {file}")
          main = (Path("site") / "index.html").read_text(encoding="utf-8")
          if "0.5.0" not in main or "fastapi-cache2" not in main:
              raise SystemExit("Docs landing must identify the current published version")
          PY
      - name: Prepare GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
      - name: Upload validated static output
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: site/

  deploy:
    name: Deploy Pages (requires approved manual run)
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
