name: Publish documentation to GitHub Pages

# Deploy only from stable. Pull requests use the read-only preview workflow.
on:
  push:
    branches: [stable]
    paths:
      - "site_docs/**"
      - "mkdocs.yml"
      - "README.md"
      - "docs/**"
      - "pyproject.toml"
      - "scripts/check_docs_version.py"
      - "scripts/check_docs_rendering.py"
      - ".github/workflows/docs-pages.yml"
  workflow_dispatch:

permissions: {}

concurrency:
  group: fastapi-cache-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build and validate current published-docs site
    if: github.ref == 'refs/heads/stable'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install pinned documentation tool
        run: python -m pip install "zensical==0.1.3"
      - name: Build site from committed sources
        run: zensical build --clean
      - name: Validate every local link and HTML anchor
        run: python scripts/check_docs_links.py --site-dir site --base-path /fastapi-cache
      - name: Validate rendered icons
        run: python scripts/check_docs_rendering.py --site-dir site
      - name: Validate release and migration entry points
        run: |
          python - <<'PY'
          from pathlib import Path
          for page in (
              "index.html",
              "getting-started/index.html",
              "migration/index.html",
              "reference/features/index.html",
              "guides/privacy/index.html",
              "reference/alternatives/index.html",
          ):
              file = Path("site") / page
              if not file.is_file():
                  raise SystemExit(f"Missing built docs page: {file}")
          main = (Path("site") / "index.html").read_text(encoding="utf-8")
          if "fastapi-cache2" not in main:
              raise SystemExit("Docs landing must identify the migration source")
          PY
      - name: Verify current publication version from pyproject.toml
        run: python scripts/check_docs_version.py --site-dir site
      - name: Upload validated static output
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: site/

  deploy:
    name: Deploy Pages from stable
    if: github.ref == 'refs/heads/stable'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Prepare GitHub Pages in deploy-only permission boundary
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
