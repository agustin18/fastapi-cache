name: Temporary audit of exact published RC2 wheel

on:
  push:
    branches:
      - audit/stable-ghsa-disposition
    paths:
      - .github/workflows/temp-exact-pypi-rc2-audit.yml

permissions:
  contents: read

jobs:
  published-wheel-audit:
    name: Published RC2 security / Python \${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: \${{ matrix.python }}
      - name: Fetch immutable published RC2 wheel from PyPI
        run: |
          python -m pip install --upgrade pip
          mkdir -p /tmp/rc2-download /tmp/security-evidence
          python -m pip download --no-cache-dir --index-url https://pypi.org/simple \
            --only-binary=:all: --no-deps --dest /tmp/rc2-download \
            "fastapi-cache-stable==0.3.0rc2"
          python - <<'PY'
          import hashlib, pathlib, sys, zipfile
          wheel, = pathlib.Path("/tmp/rc2-download").glob("*.whl")
          digest = hashlib.sha256(wheel.read_bytes()).hexdigest()
          expected = "2c3f35e053770edd708c42e88e1d2d788bc3c2ed6e2bb3d5b8409f48b79762bf"
          assert digest == expected, ("RC2 wheel hash mismatch", digest)
          evidence = pathlib.Path("/tmp/security-evidence")
          (evidence / "wheel.sha256").write_text(f"{digest}  {wheel.name}\n")
          (evidence / "python-version.txt").write_text(sys.version + "\n")
          with zipfile.ZipFile(wheel) as archive:
              names = [n for n in archive.namelist() if n.endswith(".dist-info/METADATA")]
              assert len(names) == 1
              (evidence / "wheel-METADATA.txt").write_bytes(archive.read(names[0]))
          print("Verified exact published wheel SHA-256:", digest)
          PY
      - name: Resolve full runtime and extras from published wheel
        run: |
          wheel=$(find /tmp/rc2-download -name '*.whl' -print -quit)
          python -m pip install --target /tmp/security-runtime --ignore-installed \
            "fastapi-cache-stable[all] @ file://$wheel" \
            "fastapi[standard-no-fastapi-cloud-cli]"
          python - <<'PY'
          import importlib.metadata as md, json, pathlib
          target = pathlib.Path("/tmp/security-runtime")
          records = sorted(
              ({"name": d.metadata["Name"], "version": d.version}
               for d in md.distributions(path=[str(target)])),
              key=lambda r: r["name"].lower()
          )
          (pathlib.Path("/tmp/security-evidence") / "installed-packages.json").write_text(
              json.dumps(records, indent=2) + "\n", encoding="utf-8"
          )
          print("Resolved third-party+project packages:", len(records))
          PY
      - name: Verify real venv dependency installation
        run: |
          wheel=$(find /tmp/rc2-download -name '*.whl' -print -quit)
          python -m venv /tmp/rc2-runtime
          /tmp/rc2-runtime/bin/python -m pip install --upgrade pip
          /tmp/rc2-runtime/bin/python -m pip install \
            "fastapi-cache-stable[all] @ file://$wheel" \
            "fastapi[standard-no-fastapi-cloud-cli]"
          /tmp/rc2-runtime/bin/python -m pip check
      - name: Audit exact wheel runtime inventory
        run: |
          python -m venv /tmp/rc2-auditor
          /tmp/rc2-auditor/bin/python -m pip install --upgrade pip
          /tmp/rc2-auditor/bin/python -m pip install pip-audit==2.10.1
          /tmp/rc2-auditor/bin/pip-audit --path /tmp/security-runtime \
            --aliases off --format json \
            --output /tmp/security-evidence/pip-audit.json
          python scripts/validate_security_audit.py \
            /tmp/security-evidence/pip-audit.json \
            --installed-packages /tmp/security-evidence/installed-packages.json \
            --wheel-metadata /tmp/security-evidence/wheel-METADATA.txt
      - name: Upload reproducible evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: exact-pypi-rc2-python-\${{ matrix.python }}
          path: /tmp/security-evidence/
          if-no-files-found: warn
          retention-days: 90
