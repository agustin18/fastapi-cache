name: Published 0.6.0 performance baseline

on:
  pull_request:
    branches: [stable]
    paths:
      - "benchmarks/**"
      - ".github/workflows/benchmark-published.yml"
      - "tests/test_performance_baseline_contract.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    name: Published-wheel benchmark (PR smoke / manual full)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      redis:
        image: redis:7.4
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Run isolated published-wheel baseline
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            profile=full
          else
            profile=smoke
          fi
          python benchmarks/runner.py --profile "$profile" \
            --redis-url redis://127.0.0.1:6379/15 \
            --output "$RUNNER_TEMP/published-060-benchmark"
      - name: Upload raw benchmark evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: published-060-benchmark
          path: ${{ runner.temp }}/published-060-benchmark/
          if-no-files-found: warn
          retention-days: 14
