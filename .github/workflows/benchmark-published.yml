name: Published 0.6.0 performance baseline

on:
  pull_request:
    branches: [stable]
    paths:
      - "benchmarks/**"
      - ".github/workflows/benchmark-published.yml"
      - "tests/test_performance_baseline_contract.py"
      - "tests/test_performance_historical_comparison.py"
      - "tests/test_performance_socket_contract.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    name: Published-wheel smoke (PR and manual)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      redis:
        image: redis:7.4
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Run isolated published-wheel baseline
        run: |
          set -euo pipefail
          # Keep low-cost smoke on PR and manual dispatch;
          # the full-evidence job below owns the repeated full run.
          python benchmarks/runner.py --profile smoke \
            --redis-url redis://127.0.0.1:6379/15 \
            --output "$RUNNER_TEMP/published-060-benchmark"
      - name: Upload raw benchmark evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: published-060-benchmark
          path: ${{ runner.temp }}/published-060-benchmark/
          if-no-files-found: warn
          retention-days: 14

  full-evidence:
    name: Full published 0.6.0 baseline (three isolated runs)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    services:
      redis:
        image: redis:7.4
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Run three isolated full workload processes
        run: |
          python benchmarks/runner.py --profile full --repeats 3 \
            --redis-url redis://127.0.0.1:6379/15 \
            --output "$RUNNER_TEMP/full-060-benchmark"
      - name: Upload full baseline, resources and variation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: full-060-benchmark
          path: ${{ runner.temp }}/full-060-benchmark/
          if-no-files-found: warn
          retention-days: 14

  historical-comparison:
    name: Compare published 0.5.0 versus 0.6.0 (balanced AB/BA)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    services:
      redis:
        image: redis:7.4
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Compare installed and wheel-SHA-verified historic releases
        run: |
          python benchmarks/compare_versions.py --repeats 4 \
            --redis-url redis://127.0.0.1:6379/15 \
            --output "$RUNNER_TEMP/historical-benchmark"
      - name: Upload controlled historical comparison evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: historical-050-vs-060
          path: ${{ runner.temp }}/historical-benchmark/
          if-no-files-found: warn
          retention-days: 14


  socket-http:
    name: Real 127.0.0.1 HTTP socket (published 0.6.0 wheel)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    services:
      redis:
        image: redis:7.4
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Measure standalone Uvicorn over loopback TCP, no ASGITransport
        env:
          BENCHMARK_CHECKOUT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python benchmarks/socket_runner.py --repeats 2 --iterations 120 \
            --redis-url redis://127.0.0.1:6379/15 \
            --output "$RUNNER_TEMP/socket-http-060"
      - name: Upload socket HTTP raw evidence (not independent-host certification)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: socket-http-published-060
          path: ${{ runner.temp }}/socket-http-060/
          if-no-files-found: warn
          retention-days: 14
