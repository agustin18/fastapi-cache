name: Staging lock regeneration (temporary)

on:
  pull_request:
    branches: [stable]
    paths: ["pyproject.toml", ".github/workflows/staging-lock-regeneration.yml"]

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Regenerate with pinned Poetry without requested updates
        run: |
          set -euo pipefail
          python -m pip install poetry==1.8.3
          poetry --version
          poetry lock --no-update
          poetry check --lock
          sha256sum pyproject.toml poetry.lock
          git diff --stat -- poetry.lock
      - name: Export generated lock bytes for review
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          from pathlib import Path
          data = base64.b64encode(Path("poetry.lock").read_bytes()).decode()
          print("LOCK_BASE64_BEGIN")
          for offset in range(0, len(data), 4096):
              print("LOCK_CHUNK:" + data[offset:offset + 4096])
          print("LOCK_BASE64_END")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: generated-staging-lock
          path: |
            poetry.lock
            pyproject.toml
          if-no-files-found: error
          retention-days: 30
