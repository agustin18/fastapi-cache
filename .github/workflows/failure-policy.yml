name: C3 installed failure policies (Redis 7.4)

on:
  pull_request:
    branches: [stable]
    paths:
      - "fastapi_cache/**"
      - "tests/test_failure_policy_c3.py"
      - ".github/workflows/failure-policy.yml"
      - "pyproject.toml"
      - "poetry.lock"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: c3-policy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: Installed failure policies Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    services:
      redis:
        image: redis:7.4
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "${{ matrix.python }}"
      - name: Build wheel and sdist
        run: |
          set -euo pipefail
          git rev-parse HEAD
          python -m pip install build==1.2.2
          python -m build --outdir /tmp/c3-dist
          sha256sum /tmp/c3-dist/*
          mkdir /tmp/c3-tests
          cp tests/test_failure_policy_c3.py /tmp/c3-tests/
      - name: Install and exercise both artifacts independently
        env:
          REDIS_URL: redis://localhost:6379/0
          REQUIRE_REDIS: "1"
        run: |
          set -euo pipefail
          for artifact in /tmp/c3-dist/*; do
            if [[ "$artifact" == *.whl ]]; then kind=wheel; else kind=sdist; fi
            python -m venv "/tmp/c3-$kind"
            py="/tmp/c3-$kind/bin/python"
            "$py" -m pip install "$artifact[redis]" pytest httpx
            "$py" -m pip check
            (
              cd /tmp/c3-tests
              "$py" -c "import pathlib, fastapi_cache; assert 'site-packages' in str(pathlib.Path(fastapi_cache.__file__).resolve())"
              "$py" -m pytest -q -rs -o 'markers=redis: real Redis integration'
            )
          done
