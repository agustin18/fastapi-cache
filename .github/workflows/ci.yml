name: CI

on:
  push:
    branches:
      - stable
  pull_request:
    branches:
      - stable

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - name: Install tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff==0.17.5 pre-commit
      - name: Ruff
        run: ruff check .
      - name: Pre-commit
        run: pre-commit run --all-files --show-diff-on-failure

  typecheck:
    name: Typecheck changed files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - name: Install tools
        run: |
          python -m pip install --upgrade pip
          pip install -e . mypy pytest httpx
      - name: Mypy changed Python files
        run: |
          files=$(git diff --name-only origin/stable...HEAD -- '*.py' ':!examples/*')
          if [ -n "$files" ]; then
            mypy --config-file=/dev/null --python-version 3.12 --ignore-missing-imports --follow-imports=skip $files
          else
            echo "No Python files changed"
          fi

  test:
    name: Test on Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest pytest-cov httpx coverage diff-cover
      - name: Run tests with coverage
        run: python -m pytest --cov=fastapi_cache --cov-branch --cov-report=xml
      - name: Changed-line coverage
        if: github.event_name == 'pull_request'
        run: diff-cover coverage.xml --compare-branch=origin/stable --fail-under=100

  legacy-compat:
    name: Legacy compat Python ${{ matrix.python }} / Pydantic ${{ matrix.pydantic }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.8"
            pydantic: "1.10.27"
          - python: "3.8"
            pydantic: "2.8.2"
          - python: "3.9"
            pydantic: "1.10.27"
          - python: "3.9"
            pydantic: "2.8.2"
          - python: "3.10"
            pydantic: "1.10.27"
          - python: "3.11"
            pydantic: "1.10.27"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest==8.3.5 httpx==0.27.0 \
            "fastapi==0.111.1" \
            "pydantic==${{ matrix.pydantic }}"
      - name: Show installed versions
        run: |
          python -c "import fastapi, httpx, pydantic, pytest; print('fastapi', fastapi.__version__); print('httpx', httpx.__version__); print('pydantic', pydantic.VERSION); print('pytest', pytest.__version__)"
      - name: Run tests
        run: python -m pytest -q -rs

  legacy-smoke:
    name: Legacy wheel smoke (Python 3.8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.8"
          cache: pip
      - name: Build distributions
        run: |
          python -m pip install --upgrade pip
          pip install build==1.2.2
          python -m build
      - name: Smoke install wheel
        run: |
          python -m venv /tmp/legacy-smoke
          /tmp/legacy-smoke/bin/pip install --upgrade pip
          /tmp/legacy-smoke/bin/pip install dist/*.whl "fastapi==0.111.1" "pydantic==1.10.27" "httpx==0.27.0"
          cd /tmp
          /tmp/legacy-smoke/bin/python -c "import fastapi_cache, importlib.metadata; print(importlib.metadata.version('fastapi-cache-stable'))"
          /tmp/legacy-smoke/bin/pip check
      - name: Show installed versions
        run: |
          /tmp/legacy-smoke/bin/python -c "import fastapi, pydantic; print('fastapi', fastapi.__version__); print('pydantic', pydantic.VERSION)"
      - name: Smoke cache MISS -> HIT
        run: |
          cd /tmp
          /tmp/legacy-smoke/bin/python - <<'PY'
          import pathlib

          import fastapi_cache
          from fastapi import FastAPI
          from starlette.testclient import TestClient

          from fastapi_cache import FastAPICache
          from fastapi_cache.backends.inmemory import InMemoryBackend
          from fastapi_cache.decorator import cache

          assert "site-packages" in str(pathlib.Path(fastapi_cache.__file__).resolve())

          FastAPICache.init(InMemoryBackend(), prefix="legacy-smoke")
          app = FastAPI()
          calls = {"n": 0}

          @app.get("/value")
          @cache(expire=60)
          async def value():
              calls["n"] += 1
              return {"n": calls["n"]}

          with TestClient(app) as client:
              first = client.get("/value")
              second = client.get("/value")

          assert first.status_code == 200
          assert first.headers["X-FastAPI-Cache"] == "MISS"
          assert second.headers["X-FastAPI-Cache"] == "HIT"
          assert first.json() == second.json() == {"n": 1}
          assert calls["n"] == 1
          print("legacy cache smoke OK")
          PY

  build:
    name: Build and inspect distributions
    runs-on: ubuntu-latest
    needs:
      - lint
      - test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - name: Build distributions
        run: |
          python -m pip install --upgrade pip
          pip install build twine
          python -m build
          twine check dist/*
      - name: Inspect artifacts
        run: |
          python - <<'PY'
          import glob
          import sys
          import tarfile
          import zipfile

          wheel = glob.glob("dist/*.whl")[0]
          sdist = glob.glob("dist/*.tar.gz")[0]

          with zipfile.ZipFile(wheel) as archive:
              wheel_names = archive.namelist()
          with tarfile.open(sdist) as archive:
              sdist_names = archive.getnames()

          if "fastapi_cache/__init__.py" not in wheel_names:
              raise SystemExit("wheel is missing fastapi_cache/__init__.py")
          if not any(name.endswith("dist-info/licenses/LICENSE") for name in wheel_names):
              raise SystemExit("wheel is missing the license file")

          required_docs = [
              "README.md",
              "LICENSE",
              "NOTICE",
              "MIGRATION.md",
              "SUPPORT.md",
              "SECURITY.md",
              "CHANGELOG.md",
              "FORK_ORIGIN.md",
              "COMPATIBILITY.md",
          ]
          for doc in required_docs:
              if not any(name.endswith(doc) for name in sdist_names):
                  raise SystemExit(f"sdist is missing {doc}")

          forbidden = [
              name
              for name in wheel_names + sdist_names
              if ".private" in name or "ROADMAP.private.md" in name
          ]
          if forbidden:
              raise SystemExit(f"private files in artifacts: {forbidden}")

          print("Artifacts OK")
          PY
      - name: Smoke install wheel
        run: |
          python -m venv /tmp/smoke-wheel
          /tmp/smoke-wheel/bin/pip install --upgrade pip
          /tmp/smoke-wheel/bin/pip install dist/*.whl
          cd /tmp
          /tmp/smoke-wheel/bin/python -c "import fastapi_cache, importlib.metadata, pathlib; p=str(pathlib.Path(fastapi_cache.__file__).resolve()); assert 'site-packages' in p, p; assert importlib.metadata.version('fastapi-cache-stable'); print(p)"
          /tmp/smoke-wheel/bin/pip check
      - name: Smoke install sdist
        run: |
          python -m venv /tmp/smoke-sdist
          /tmp/smoke-sdist/bin/pip install --upgrade pip
          /tmp/smoke-sdist/bin/pip install dist/*.tar.gz
          cd /tmp
          /tmp/smoke-sdist/bin/python -c "import fastapi_cache, importlib.metadata, pathlib; p=str(pathlib.Path(fastapi_cache.__file__).resolve()); assert 'site-packages' in p, p; assert importlib.metadata.version('fastapi-cache-stable'); print(p)"
          /tmp/smoke-sdist/bin/pip check
