name: CI

on:
  push:
    branches:
      - stable
  pull_request:
    branches:
      - stable

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pagination-integration:
    name: Characterize fastapi-pagination 0.13.1 (upstream issue 557)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - name: Install the reported integration profile
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest==8.3.5 httpx==0.27.0 \
            fastapi==0.115.12 fastapi-pagination==0.13.1
          python -m pip check
      - name: Characterize only the known dependency-injection limitation
        run: python -m pytest -q -rxX tests/test_optional_pagination.py

  lint:
    name: Lint and pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - name: Install tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff==0.17.5 pre-commit
      - name: Ruff
        run: ruff check .
      - name: Pre-commit
        run: pre-commit run --all-files --show-diff-on-failure

  typecheck:
    name: Typecheck changed files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - name: Install tools
        run: |
          python -m pip install --upgrade pip
          pip install -e . mypy pytest httpx
      - name: Mypy changed Python files
        run: |
          files=$(git diff --name-only origin/stable...HEAD -- '*.py' ':!examples/*')
          if [ -n "$files" ]; then
            mypy --config-file=/dev/null --python-version 3.12 --ignore-missing-imports --follow-imports=skip $files
          else
            echo "No Python files changed"
          fi

  test:
    name: Test on Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[redis]" pytest pytest-cov httpx httpx2 coverage diff-cover
      - name: Run tests with coverage
        env:
          REDIS_URL: redis://localhost:6379/0
        run: python -m pytest --cov=fastapi_cache --cov-branch --cov-report=xml
      - name: Changed-line coverage
        if: github.event_name == 'pull_request'
        run: diff-cover coverage.xml --compare-branch=origin/stable --fail-under=100

  legacy-compat:
    name: Legacy compat Python ${{ matrix.python }} / Pydantic ${{ matrix.pydantic }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.8"
            pydantic: "1.10.27"
          - python: "3.8"
            pydantic: "2.8.2"
          - python: "3.9"
            pydantic: "1.10.27"
          - python: "3.9"
            pydantic: "2.8.2"
          - python: "3.10"
            pydantic: "1.10.27"
          - python: "3.11"
            pydantic: "1.10.27"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest==8.3.5 httpx==0.27.0 \
            "fastapi==0.111.1" \
            "pydantic==${{ matrix.pydantic }}"
      - name: Show installed versions
        run: |
          python -c "import fastapi, httpx, pydantic, pytest; print('fastapi', fastapi.__version__); print('httpx', httpx.__version__); print('pydantic', pydantic.VERSION); print('pytest', pytest.__version__)"
      - name: Run tests
        run: python -m pytest -q -rs

  legacy-smoke:
    name: Legacy wheel smoke (Python 3.8)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.8"
          cache: pip
      - name: Build distributions
        run: |
          python -m pip install --upgrade pip
          pip install build==1.2.2
          python -m build
      - name: Smoke install wheel
        run: |
          python -m venv /tmp/legacy-smoke
          /tmp/legacy-smoke/bin/pip install --upgrade pip
          wheel=$(python -c "from glob import glob; print(glob('dist/*.whl')[0])")
          /tmp/legacy-smoke/bin/pip install "${wheel}[all]" "fastapi==0.111.1" "pydantic==1.10.27" "httpx==0.27.0"
          cd /tmp
          /tmp/legacy-smoke/bin/python -c "import fastapi_cache, importlib.metadata; print(importlib.metadata.version('fastapi-cache-stable'))"
          /tmp/legacy-smoke/bin/pip check
      - name: Confirm optional DynamoDB client is excluded on legacy Python
        run: |
          /tmp/legacy-smoke/bin/python - <<'PY'
          import importlib.util

          assert importlib.util.find_spec("aiobotocore") is None
          assert importlib.util.find_spec("aiohttp") is None
          print("DynamoDB extra intentionally unavailable on Python 3.8")
          PY
      - name: Show installed versions
        run: |
          /tmp/legacy-smoke/bin/python -c "import fastapi, pydantic; print('fastapi', fastapi.__version__); print('pydantic', pydantic.VERSION)"
      - name: Smoke cache MISS -> HIT
        run: |
          cd /tmp
          /tmp/legacy-smoke/bin/python - <<'PY'
          import pathlib

          import fastapi_cache
          from fastapi import FastAPI
          from starlette.testclient import TestClient

          from fastapi_cache import FastAPICache
          from fastapi_cache.backends.inmemory import InMemoryBackend
          from fastapi_cache.decorator import cache

          assert "site-packages" in str(pathlib.Path(fastapi_cache.__file__).resolve())

          FastAPICache.init(InMemoryBackend(), prefix="legacy-smoke")
          app = FastAPI()
          calls = {"n": 0}

          @app.get("/value")
          @cache(expire=60)
          async def value():
              calls["n"] += 1
              return {"n": calls["n"]}

          with TestClient(app) as client:
              first = client.get("/value")
              second = client.get("/value")

          assert first.status_code == 200
          assert first.headers["X-FastAPI-Cache"] == "MISS"
          assert second.headers["X-FastAPI-Cache"] == "HIT"
          assert first.json() == second.json() == {"n": 1}
          assert calls["n"] == 1
          print("legacy cache smoke OK")
          PY

  locked-profiles:
    name: Poetry lock profile Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.8", "3.9", "3.10", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install Poetry
        run: |
          python -m pip install --upgrade pip
          pip install poetry==1.8.3
      - name: Validate and install locked profile
        env:
          POETRY_VIRTUALENVS_IN_PROJECT: "true"
          POETRY_NO_INTERACTION: "1"
        run: |
          poetry check --lock
          poetry install --with dev --all-extras --sync
      - name: Check locked security profile
        run: |
          poetry run python -m pip check
          poetry run python - <<'PY'
          import importlib.metadata as metadata
          import importlib.util
          import sys
          from packaging.version import Version

          anyio = Version(metadata.version("anyio"))
          print("python", sys.version.split()[0], "anyio", anyio)
          if sys.version_info < (3, 10):
              # These EOL runtimes retain only the documented legacy functional profile.
              assert importlib.util.find_spec("aiobotocore") is None
              assert importlib.util.find_spec("aiohttp") is None
          else:
              assert anyio >= Version("4.14.2")
              assert Version(metadata.version("aiohttp")) >= Version("3.14.4")
              assert importlib.util.find_spec("aiobotocore") is not None
          PY
      - name: Test dependency metadata and optional backend
        run: >-
          poetry run python -m pytest -q -rs tests/test_distribution_metadata.py
          tests/test_dynamodb_backend.py tests/test_dynamodb_transport.py

  redis-clear:
    name: Redis clear integration (Redis 7)
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[redis]" pytest==8.3.5 httpx==0.27.0 httpx2
      - name: Run Redis clear integration tests
        env:
          REDIS_URL: redis://localhost:6379/0
          REQUIRE_REDIS: "1"
        run: python -m pytest -q tests/test_redis_clear.py -rs

  optional-backends:
    name: Optional backend unit tests (Memcached, DynamoDB)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[memcache,dynamodb]" pytest==8.3.5 httpx==0.27.0
      - name: Run optional backend tests
        run: >-
          python -m pytest -q tests/test_memcached_backend.py
          tests/test_dynamodb_backend.py tests/test_dynamodb_transport.py -rs

  security-audit:
    name: Security audit on Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Build profile wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir /tmp/security-dist
      - name: Install runtime profile into isolated target
        run: |
          wheel=$(python -c "from glob import glob; print(glob('/tmp/security-dist/*.whl')[0])")
          python -m pip install --target /tmp/security-runtime --ignore-installed \
            "fastapi-cache-stable[all] @ file://$wheel" \
            "fastapi[standard-no-fastapi-cloud-cli]"
      - name: Install isolated auditor
        run: |
          python -m venv /tmp/security-auditor
          /tmp/security-auditor/bin/python -m pip install --upgrade pip
          /tmp/security-auditor/bin/python -m pip install pip-audit==2.10.1
      - name: Record wheel and runtime profile provenance
        run: |
          mkdir -p /tmp/security-evidence
          wheel=$(python -c "from glob import glob; print(glob('/tmp/security-dist/*.whl')[0])")
          cp "$wheel" /tmp/security-evidence/
          python - <<'PY'
          import hashlib
          import pathlib
          import sys
          import zipfile

          wheel_name = next(pathlib.Path("/tmp/security-dist").glob("*.whl")).name
          wheel = pathlib.Path("/tmp/security-evidence") / wheel_name
          digest = hashlib.sha256(wheel.read_bytes()).hexdigest()
          (wheel.parent / "wheel.sha256").write_text(
              f"{digest}  {wheel.name}\n", encoding="utf-8"
          )
          with zipfile.ZipFile(wheel) as archive:
              metadata_name = next(
                  name
                  for name in archive.namelist()
                  if name.endswith(".dist-info/METADATA")
              )
              (wheel.parent / "wheel-METADATA.txt").write_bytes(
                  archive.read(metadata_name)
              )
          (wheel.parent / "python-version.txt").write_text(
              sys.version + "\n", encoding="utf-8"
          )
          PY
          python -m pip freeze --path /tmp/security-runtime \
            > /tmp/security-evidence/installed-packages.txt
          python - <<'PY'
          import importlib.metadata as metadata
          import json
          from pathlib import Path

          installed = [
              {"name": dist.metadata["Name"], "version": dist.version}
              for dist in metadata.distributions(path=["/tmp/security-runtime"])
          ]
          path = Path("/tmp/security-evidence/installed-packages.json")
          path.write_text(
              json.dumps(
                  sorted(installed, key=lambda record: record["name"].lower()),
                  indent=2,
              ) + "\n",
              encoding="utf-8",
          )
          PY
          python -m pip --version > /tmp/security-evidence/pip-version.txt
          /tmp/security-auditor/bin/pip-audit --version \
            > /tmp/security-evidence/pip-audit-version.txt
      - name: Audit supported runtime profile
        run: >-
          /tmp/security-auditor/bin/pip-audit --path /tmp/security-runtime
          --aliases off --format json
          --output /tmp/security-evidence/pip-audit.json
      - name: Validate audit completeness
        run: >-
          python scripts/validate_security_audit.py
          /tmp/security-evidence/pip-audit.json
          --installed-packages /tmp/security-evidence/installed-packages.json
          --wheel-metadata /tmp/security-evidence/wheel-METADATA.txt
      - name: Upload security profile evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: security-profile-python-${{ matrix.python }}
          path: /tmp/security-evidence/
          if-no-files-found: warn
          retention-days: 90

  build:
    name: Build and inspect distributions
    runs-on: ubuntu-latest
    needs:
      - lint
      - test
      - security-audit
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - name: Build distributions
        run: |
          python -m pip install --upgrade pip
          pip install build twine
          python -m build
          twine check dist/*
      - name: Inspect artifacts
        run: |
          python - <<'PY'
          import glob
          import sys
          import tarfile
          import zipfile

          wheel = glob.glob("dist/*.whl")[0]
          sdist = glob.glob("dist/*.tar.gz")[0]

          with zipfile.ZipFile(wheel) as archive:
              wheel_names = archive.namelist()
          with tarfile.open(sdist) as archive:
              sdist_names = archive.getnames()

          if "fastapi_cache/__init__.py" not in wheel_names:
              raise SystemExit("wheel is missing fastapi_cache/__init__.py")
          if not any(name.endswith("dist-info/licenses/LICENSE") for name in wheel_names):
              raise SystemExit("wheel is missing the license file")

          required_docs = [
              "README.md",
              "LICENSE",
              "NOTICE",
              "MIGRATION.md",
              "SUPPORT.md",
              "SECURITY.md",
              "CHANGELOG.md",
              "FORK_ORIGIN.md",
              "COMPATIBILITY.md",
          ]
          for doc in required_docs:
              if not any(name.endswith(doc) for name in sdist_names):
                  raise SystemExit(f"sdist is missing {doc}")

          forbidden = [
              name
              for name in wheel_names + sdist_names
              if ".private" in name or "ROADMAP.private.md" in name
          ]
          if forbidden:
              raise SystemExit(f"private files in artifacts: {forbidden}")

          print("Artifacts OK")
          PY
      - name: Smoke install wheel
        run: |
          python -m venv /tmp/smoke-wheel
          /tmp/smoke-wheel/bin/pip install --upgrade pip
          /tmp/smoke-wheel/bin/pip install dist/*.whl
          cd /tmp
          /tmp/smoke-wheel/bin/python -c "import fastapi_cache, importlib.metadata, pathlib; p=str(pathlib.Path(fastapi_cache.__file__).resolve()); assert 'site-packages' in p, p; assert importlib.metadata.version('fastapi-cache-stable'); print(p)"
          /tmp/smoke-wheel/bin/pip check
      - name: Smoke install sdist
        run: |
          python -m venv /tmp/smoke-sdist
          /tmp/smoke-sdist/bin/pip install --upgrade pip
          /tmp/smoke-sdist/bin/pip install dist/*.tar.gz
          cd /tmp
          /tmp/smoke-sdist/bin/python -c "import fastapi_cache, importlib.metadata, pathlib; p=str(pathlib.Path(fastapi_cache.__file__).resolve()); assert 'site-packages' in p, p; assert importlib.metadata.version('fastapi-cache-stable'); print(p)"
          /tmp/smoke-sdist/bin/pip check
