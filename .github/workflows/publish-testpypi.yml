name: Publish to TestPyPI

on:
  workflow_dispatch:
    inputs:
      evidence_run_id:
        description: Successful manual Phase B run on the final stable SHA
        required: true
        type: string
      wheel_sha256:
        description: Reviewed SHA-256 of the exact wheel
        required: true
        type: string
      sdist_sha256:
        description: Reviewed SHA-256 of the exact sdist
        required: true
        type: string

permissions:
  contents: read

jobs:
  preflight:
    name: Check publish source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Require an annotated, version-matching release tag
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["tool"]["poetry"]["version"])')
          test "$GITHUB_REF" = "refs/tags/v$version"
          test "$(git cat-file -t "$GITHUB_REF")" = tag
          test "$(git rev-parse "$GITHUB_REF^{commit}")" = "$GITHUB_SHA"
          grep -Fq "## [$version]" CHANGELOG.md
          git fetch origin stable
          git merge-base --is-ancestor "$GITHUB_SHA" origin/stable

  test:
    name: Test the release commit on Python ${{ matrix.python }}
    needs: preflight
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest httpx httpx2
      - name: Run tests
        run: python -m pytest -q

  build:
    name: Retrieve the reviewed distribution pair (never rebuild)
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Fetch evidence run metadata
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.evidence_run_id }}
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" > "$RUNNER_TEMP/evidence-run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/attempts/1/jobs?per_page=100" > "$RUNNER_TEMP/evidence-jobs.json"
      - name: Download Phase B evidence from the approved run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: migration-phase-b-060-distributions
          run-id: ${{ inputs.evidence_run_id }}
          github-token: ${{ github.token }}
          path: evidence-bundle/
      - name: Verify exact source, run, manifest and approved hashes
        env:
          RUN_ID: ${{ inputs.evidence_run_id }}
          WHEEL_SHA: ${{ inputs.wheel_sha256 }}
          SDIST_SHA: ${{ inputs.sdist_sha256 }}
        run: |
          set -euo pipefail
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["tool"]["poetry"]["version"])')
          python scripts/verify_release_bundle.py \
            --run-json "$RUNNER_TEMP/evidence-run.json" \
            --jobs-json "$RUNNER_TEMP/evidence-jobs.json" \
            --repository "$GITHUB_REPOSITORY" --source-sha "$GITHUB_SHA" \
            --run-id "$RUN_ID" --version "$version" \
            --wheel-sha "$WHEEL_SHA" --sdist-sha "$SDIST_SHA" \
            --bundle evidence-bundle --output dist
          python -m pip install twine
          python -m twine check dist/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to TestPyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/fastapi-cache-stable
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: dist
          path: dist/
      - name: Recheck the approved pair immediately before upload
        env:
          WHEEL_SHA: ${{ inputs.wheel_sha256 }}
          SDIST_SHA: ${{ inputs.sdist_sha256 }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          wheels=(dist/*.whl)
          sdists=(dist/*.tar.gz)
          files=(dist/*)
          test "${#wheels[@]}" -eq 1
          test "${#sdists[@]}" -eq 1
          test "${#files[@]}" -eq 2
          printf '%s  %s\n' "$WHEEL_SHA" "${wheels[0]}" "$SDIST_SHA" "${sdists[0]}" | sha256sum --check
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/
          print-hash: true
