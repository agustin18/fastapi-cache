[tool.poetry]
name = "fastapi-cache-stable"
version = "0.3.0rc1"
description = "Community-maintained, drop-in stable fork of fastapi-cache2"
authors = ["Agustin Saiz <agustinsaiz02@gmail.com>"]
license = "Apache-2.0"
readme = "README.md"
homepage = "https://github.com/agustin18/fastapi-cache"
repository = "https://github.com/agustin18/fastapi-cache.git"
documentation = "https://github.com/agustin18/fastapi-cache#readme"
keywords = ["fastapi", "cache", "caching"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
packages = [
    { include = "fastapi_cache" }
]
include = [
    "LICENSE",
    "NOTICE",
    "README.md",
    "MIGRATION.md",
    "SUPPORT.md",
    "SECURITY.md",
    "CHANGELOG.md",
    "FORK_ORIGIN.md",
    "COMPATIBILITY.md",
]

[tool.poetry.dependencies]
python = ">=3.8,<3.14"
fastapi = "*"
uvicorn = "*"
jinja2 = ">=3.0"
redis = { version = "^4.2.0rc1", optional = true }
typing-extensions = { version = ">=4.1.0" }
importlib-metadata = { version = "^6.6.0", python = "<3.8" }
pendulum = [
    { version = "3.0.*", python = ">=3.8,<3.9" },
    { version = "3.1.*", python = ">=3.9,<3.10" },
    { version = ">=3.2,<4.0", python = ">=3.10" },
]
# Pendulum 3.0.x wheel metadata requires this on CPython 3.8 despite its source extra metadata.
time-machine = { version = ">=2.6.0", markers = "python_version < '3.9' and implementation_name != 'pypy'" }
aiomcache = { version = "^0.8.2", optional = true }
# DynamoDB is supported only where patched aiohttp releases are available.
aiobotocore = { version = "^2.13.1", optional = true, python = ">=3.10" }
aiohttp = { version = ">=3.14.4,<4.0.0", optional = true, python = ">=3.10" }

[tool.poetry.group.linting]
optional = true

[tool.poetry.group.linting.dependencies]
mypy = { version = "^1.2.0", python = "^3.10" }
pyright = { version = "^1.1.373", python = "^3.10" }
types-aiobotocore = { extras = ["dynamodb"], version = "^2.5.0.post2", python = "^3.10" }
types-redis = { version = "^4.5.4.2", python = "^3.10" }
ruff = { version = ">=0.17,<0.18", python = "^3.10" }

[tool.poetry.group.dev.dependencies]
# Test-only lock constraints: do not alter the published main runtime
# dependency ranges. Recent security fixes require newer Python than 3.8/3.9.
fastapi = [
    { version = "*", python = ">=3.8,<3.10" },
    { version = ">=0.150", python = ">=3.10,<3.11" },
    { version = ">=0.164.0", python = ">=3.11" },
]
pytest = [
    { version = ">=8.3.5,<9", python = ">=3.8,<3.10" },
    { version = ">=9.0.3,<10", python = ">=3.10" },
]
requests = [
    { version = ">=2.32.4,<2.33", python = ">=3.8,<3.10" },
    { version = ">=2.33.0,<3", python = ">=3.10" },
]
urllib3 = [
    { version = ">=2.2.3,<2.5", python = ">=3.8,<3.10" },
    { version = ">=2.8.0,<3", python = ">=3.10" },
]
cryptography = [
    { version = ">=45.0.7,<49", python = ">=3.8,<3.10" },
    { version = ">=49.0.0,<51", python = ">=3.10" },
]
coverage = ">=6.5,<8.0"
httpx = "*"
# Keep the modern lock-installed profile on fixed AnyIO. The Python 3.8/3.9 constraint
# preserves the functional legacy test matrix; its AnyIO residual remains separately triaged.
anyio = [
    { version = ">=4.14.2,<5.0", python = ">=3.10" },
    { version = "<4.14.2", python = ">=3.8,<3.10" },
]
towncrier = { version = ">=26,<27", python = ">=3.9" }

[tool.poetry.group.distributing]
optional = true

[tool.poetry.group.distributing.dependencies]
twine = { version = "^4.0.2", python = "^3.10" }

[tool.poetry.extras]
redis = ["redis"]
memcache = ["aiomcache"]
dynamodb = ["aiobotocore", "aiohttp"]
all = ["redis", "aiomcache", "aiobotocore", "aiohttp"]

[tool.mypy]
files = ["."]
python_version = "3.11"
# equivalent of --strict
warn_unused_configs = true
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_reexport = true
strict_equality = true
extra_checks = true

[[tool.mypy.overrides]]
module = "examples.*.main"
ignore_errors = true

[tool.towncrier]
directory = "changelog.d"
filename = "CHANGELOG.md"
package = "fastapi_cache"
start_string = "<!-- towncrier release notes start -->\n"
underlines = ["", "", ""]
template = "changelog.d/changelog_template.jinja"
title_format = "## [{version}](https://github.com/agustin18/fastapi-cache/tree/v{version}) - {project_date}"
issue_format = "[#{issue}](https://github.com/agustin18/fastapi-cache/issues/{issue})"

# Declare every fragment type explicitly. The built-in default hides the content of `misc`
# fragments, which renders an empty bullet as soon as the fragment carries an issue number.
# Keep this list in sync with the fragment types documented in CONTRIBUTING.md.
[[tool.towncrier.type]]
directory = "feature"
name = "Features"
showcontent = true

[[tool.towncrier.type]]
directory = "bugfix"
name = "Bugfixes"
showcontent = true

[[tool.towncrier.type]]
directory = "doc"
name = "Improved Documentation"
showcontent = true

[[tool.towncrier.type]]
directory = "removal"
name = "Deprecations and Removals"
showcontent = true

[[tool.towncrier.type]]
directory = "misc"
name = "Misc"
showcontent = true

[tool.pyright]
strict = ["fastapi_cache", "tests"]
pythonVersion = "3.11"

[tool.pytest.ini_options]
addopts = "-p no:warnings"
markers = [
    "redis: integration tests that require a Redis server",
]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["fastapi_cache"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
ignore = ["E501"]
line-length = 80
select = [
    "B", # flake8-bugbear
    "C4", # flake8-comprehensions
    "E", # pycodestyle errors
    "F", # pyflakes
    "I", # isort
    "S", # flake8-bandit
    "W", # pycodestyle warnings
    "UP", # pyupgrade
]
target-version = "py38"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
